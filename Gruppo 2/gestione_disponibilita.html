<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Disponibilità</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .form-container { background: #f4f4f4; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Gestione Disponibilità</h2>

    <div class="form-container">
        <h3>Aggiungi Nuova</h3>
        <input type="date" id="data">
        <input type="time" id="inizio">
        <input type="time" id="fine">
        <button onclick="creaDisponibilita()">Salva</button>
    </div>

    <table id="tabellaDisponibilita">
        <thead>
            <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Inizio</th>
                <th>Fine</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function caricaDati() {
            const res = await fetch('api_disponibilita.php');
            const dati = await res.json();
            const tbody = document.querySelector("#tabellaDisponibilita tbody");
            tbody.innerHTML = "";

            dati.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.data}</td>
                        <td>${item.ora_inizio}</td>
                        <td>${item.ora_fine}</td>
                        <td><button onclick="elimina(${item.id})">Elimina</button></td>
                    </tr>`;
            });
        }

        async function creaDisponibilita() {
            const payload = {
                data: document.getElementById('data').value,
                ora_inizio: document.getElementById('inizio').value,
                ora_fine: document.getElementById('fine').value
            };

            await fetch('api_disponibilita.php', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            caricaDati();
        }

        async function elimina(id) {
            if(confirm("Sei sicuro?")) {
                await fetch(`api_disponibilita.php?id=${id}`, { method: 'DELETE' });
                caricaDati();
            }
        }

        caricaDati();
    </script>
</body>
</html>
