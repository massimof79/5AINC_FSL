<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Gestione Aziende</title>
<link rel="stylesheet" href="stile.css">
</head>
<body>

<h1>Gestione Aziende</h1>

<form id="form">
    <input type="hidden" id="id">

    <input type="text" id="ragione_sociale" placeholder="Ragione Sociale" required>
    <input type="text" id="partita_iva" placeholder="Partita IVA" required>
    <input type="text" id="sede_legale" placeholder="Sede Legale">
    <input type="text" id="sede_operativa" placeholder="Sede Operativa">

    <label>
        <input type="checkbox" id="terms" required>
        Accetto il trattamento dati (GDPR UE 2016/679)
    </label>

    <button>Salva</button>
</form>

<table>
<thead>
<tr><th>ID</th><th>Nome</th><th>PIVA</th><th>Azioni</th></tr>
</thead>
<tbody id="list"></tbody>
</table>

<script src="app.js"></script>
</body>
</html>
